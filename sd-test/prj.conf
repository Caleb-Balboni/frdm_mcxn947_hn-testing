CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Larger main stack — we hold a 32 KB benchmark buffer on it (could move to
# static but stack is easiest)
CONFIG_MAIN_STACK_SIZE=4096

# SD subsystem stack — disk-access -> sdmmc -> sdhc -> usdhc
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_SDHC=y
CONFIG_IMX_USDHC=y

# Logging — turn on while bringing this up so we can see what got negotiated
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SD_LOG_LEVEL_INF=y
CONFIG_SDMMC_LOG_LEVEL_INF=y
CONFIG_DISK_LOG_LEVEL_INF=y
